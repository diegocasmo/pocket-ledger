name: 'Code Improver'

on:
  schedule:
    # GitHub delays scheduled runs (~3h observed), so we schedule early. Staggered
    # one minute after the sibling routines (tonebuilder 03:07, findmomentum 03:08)
    # so the shared Claude token is not driven by all three at once.
    - cron: '9 3 * * *'
  workflow_dispatch:

concurrency:
  group: code-improver
  cancel-in-progress: false

permissions:
  contents: write # push the feature branch
  pull-requests: write # open the PR
  actions: read # read CI results
  id-token: write # OAuth flow for the Claude action

jobs:
  improve:
    runs-on: ubuntu-latest
    # Headroom for a full survey plus up to 100 turns at max effort
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Code Improver
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: false
          prompt: |
            Read .github/code-improver/PROMPT.md and follow it EXACTLY.
          # --tools locks the available built-in set (no Agent/subagent or
          # background tools); --allowed-tools only auto-approves prompts.
          claude_args: '--model claude-fable-5 --effort xhigh --max-turns 100 --tools "Bash,Edit,Write,Read,Grep,Glob" --allowed-tools "Bash,Edit,Write,Read,Grep,Glob"'

      # A silently-stranded run still reports success, so require the agent to
      # have written a terminal marker. Absence means it never reached a PR or a
      # no-op decision (stranded, crashed, or hit the turn limit): fail loudly.
      - name: Verify the run reached a terminal decision
        run: |
          if [ -f .code-improver-result ] && grep -qE '^[[:space:]]*(PR|NOOP)[[:space:]]*$' .code-improver-result; then
            echo "Terminal decision: $(cat .code-improver-result)"
          else
            echo "::error::Code Improver wrote no terminal marker (expected PR or NOOP). It likely stranded, crashed, or hit the turn limit instead of finishing."
            exit 1
          fi
